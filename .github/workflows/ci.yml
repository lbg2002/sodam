name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config git \
            libasound2-dev libdbus-1-dev libfontconfig1-dev \
            libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

  test-macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 仓库无额外系统依赖：DBus 只在 Linux 托盘（ksni）用，macOS 托盘走 NSStatusItem。
      # Metal shader 编译需要完整版 Xcode，macOS runner 镜像自带。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

  test-windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Windows runner 自带 VS Build Tools；托盘（tray-icon）与 DirectX 后端无需额外系统依赖。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

  package-deb:
    name: Debian package (${{ matrix.deb_arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            runner: ubuntu-latest
          - deb_arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config git \
            libasound2-dev libdbus-1-dev libfontconfig1-dev \
            libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release --locked --workspace
      - name: Package and verify
        run: |
          package=$(packaging/make-deb.sh "" "${{ matrix.deb_arch }}")
          packaging/verify-deb.sh "$package"
          mkdir -p output
          cp "$package" "$package.sha256" output/
      - uses: actions/upload-artifact@v4
        with:
          name: sodam-deb-${{ matrix.deb_arch }}
          path: output/*
          if-no-files-found: error
          retention-days: 7
